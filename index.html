<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0B0D" />
  <meta name="description" content="AetherOS — Container operations, telemetry, and AI infrastructure management." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0B0D'/%3E%3Cpath d='M9 10h14v3H9zm0 5h9v3H9zm0 5h14v3H9z' fill='%233B82F6'/%3E%3C/svg%3E" />
  <title>AetherOS — Container &amp; AI Operations</title>
  <script>
    (function () {
      var themes = ['dark', 'light', 'subtle', 'monochrome'];
      var themeColors = {
        dark: '#0A0B0D',
        light: '#FAFAFA',
        subtle: '#F1F0EC',
        monochrome: '#FFFFFF'
      };
      var theme = 'dark';
      var fontSize = 14;
      try {
        var storedTheme = window.localStorage.getItem('kai-theme');
        if (storedTheme && themes.indexOf(storedTheme) !== -1) {
          theme = storedTheme;
        }
        var storedFont = window.localStorage.getItem('kai-font-size');
        if (storedFont !== null && storedFont !== '') {
          var parsed = Number(storedFont);
          if (isFinite(parsed)) {
            fontSize = Math.min(22, Math.max(12, Math.round(parsed)));
          }
        }
      } catch (_err) {
        // Ignore storage errors in restricted browsing contexts.
      }
      var root = document.documentElement;
      root.setAttribute('data-theme', theme);
      for (var i = 0; i < themes.length; i++) {
        root.classList.remove('theme-' + themes[i]);
      }
      root.classList.add('theme-' + theme);
      root.style.setProperty('--app-base-font-size', fontSize + 'px');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta && themeColors[theme]) {
        meta.setAttribute('content', themeColors[theme]);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
</head>

<body class="font-sans antialiased bg-canvas text-ink selection:bg-primary/20">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
